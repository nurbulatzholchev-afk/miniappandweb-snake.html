<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Змейка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0; padding: 0; background-color: #0f172a;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden; touch-action: none; font-family: sans-serif; color: #fff;
        }
        canvas { 
            background-color: #1e293b; border-radius: 12px; 
            box-shadow: 0 0 25px rgba(74, 222, 128, 0.2); 
            border: 2px solid #334155;
        }
        #score-board { font-size: 22px; margin-bottom: 15px; font-weight: bold; letter-spacing: 1px; }
        #score { color: #4ade80; }
        #game-over {
            position: absolute; display: none; flex-direction: column; align-items: center;
            background: rgba(15, 23, 42, 0.95); padding: 30px; border: 2px solid #ef4444; border-radius: 15px;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.4);
        }
        #game-over h2 { color: #ef4444; margin: 0 0 15px 0; }
        button { 
            padding: 12px 24px; font-size: 18px; background: #4ade80; color: #0f172a; 
            border: none; border-radius: 8px; font-weight: bold; cursor: pointer; 
        }
    </style>
</head>
<body>
    <div id="score-board">СЧЕТ: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="300" height="300"></canvas>
    <div id="game-over">
        <h2>ВЫ ПРОИГРАЛИ</h2>
        <button onclick="location.reload()">ЗАНОВО</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        
        const gridSize = 15; // 20x20 клеток
        const tileCount = canvas.width / gridSize;

        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let dx = 0, dy = 0;
        let nextDx = 0, nextDy = 0;
        let score = 0;
        let speed = 120;
        let gameLoop;

        function generateFood() {
            let newFood;
            while (true) {
                newFood = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
                // Проверка, чтобы еда не появилась в змейке
                if (!snake.some(seg => seg.x === newFood.x && seg.y === newFood.y)) break;
            }
            food = newFood;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Рисуем сетку (слабо заметную)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath(); ctx.moveTo(i * gridSize, 0); ctx.lineTo(i * gridSize, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i * gridSize); ctx.lineTo(canvas.width, i * gridSize); ctx.stroke();
            }

            // Рисуем еду (яблоко)
            ctx.fillStyle = '#ef4444';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ef4444';
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Рисуем змейку
            snake.forEach((segment, index) => {
                const isHead = index === 0;
                ctx.fillStyle = isHead ? '#4ade80' : `hsl(142, 70%, ${50 - (index * 1.5)}%)`;
                if (isHead) {
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#4ade80';
                }
                
                // Рисуем закругленные квадратики
                ctx.beginPath();
                ctx.roundRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2, isHead ? 6 : 4);
                ctx.fill();
                ctx.shadowBlur = 0;
                
                // Глазки для головы
                if (isHead) {
                    ctx.fillStyle = '#0f172a';
                    let eyeOffset = gridSize / 4;
                    let eyeSize = gridSize / 5;
                    
                    // Позиция глаз зависит от направления
                    let p1 = {x: eyeOffset, y: eyeOffset}, p2 = {x: gridSize - eyeOffset - eyeSize, y: eyeOffset};
                    if (dy !== 0) { p1 = {x: eyeOffset, y: eyeOffset}; p2 = {x: gridSize - eyeOffset - eyeSize, y: eyeOffset}; }
                    
                    ctx.beginPath(); ctx.arc(segment.x*gridSize + p1.x, segment.y*gridSize + p1.y, eyeSize/2, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(segment.x*gridSize + p2.x, segment.y*gridSize + p2.y, eyeSize/2, 0, Math.PI*2); ctx.fill();
                }
            });
        }

        function update() {
            if (nextDx !== 0 || nextDy !== 0) {
                if (!(nextDx === -dx && nextDy === -dy)) {
                    dx = nextDx; dy = nextDy;
                }
            }

            if (dx === 0 && dy === 0) return;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // Столкновение со стенами
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) return endGame();
            // Столкновение с собой
            if (snake.some(seg => seg.x === head.x && seg.y === head.y)) return endGame();

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.innerText = score;
                generateFood();
                tg.HapticFeedback.impactOccurred('light');
                
                // Ускорение каждые 50 очков
                if (score % 50 === 0 && speed > 60) {
                    speed -= 10;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(update, speed);
                }
            } else {
                snake.pop();
            }

            draw();
        }

        function endGame() {
            clearInterval(gameLoop);
            document.getElementById('game-over').style.display = 'flex';
            tg.HapticFeedback.notificationOccurred('error');
        }

        // Свайпы
        let touchStartX = 0, touchStartY = 0;
        document.addEventListener('touchstart', e => { 
            touchStartX = e.changedTouches[0].screenX; 
            touchStartY = e.changedTouches[0].screenY; 
        }, {passive: false});

        document.addEventListener('touchend', e => {
            let diffX = e.changedTouches[0].screenX - touchStartX;
            let diffY = e.changedTouches[0].screenY - touchStartY;
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 20 && dx === 0) { nextDx = 1; nextDy = 0; }
                else if (diffX < -20 && dx === 0) { nextDx = -1; nextDy = 0; }
            } else {
                if (diffY > 20 && dy === 0) { nextDx = 0; nextDy = 1; }
                else if (diffY < -20 && dy === 0) { nextDx = 0; nextDy = -1; }
            }
        }, {passive: false});

        generateFood();
        draw();
        gameLoop = setInterval(update, speed);
    </script>
</body>
</html>
